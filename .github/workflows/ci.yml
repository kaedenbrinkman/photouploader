name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lib tests
        run: |
          pip install pytest
          cd lib && pytest -q
      - name: Worker tests
        run: |
          pip install pytest pytest-timeout
          pip install -r worker/requirements.txt
          cd worker && PYTHONPATH=../lib:. pytest -q -m "not integration"
      - name: LightCraft importPreview smoke (optional)
        run: |
          chmod +x scripts/lightcraft-import-preview-smoke.sh
          scripts/lightcraft-import-preview-smoke.sh
      - name: Backend moto tests
        run: |
          pip install -r backend/requirements-dev.txt
          PYTHONPATH=lib:backend/tests pytest -q backend/tests

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install & synth
        working-directory: infra
        run: |
          npm ci || npm install
          npm test
          npx cdk synth --quiet

  worker-ami:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Bootstrap script syntax
        run: bash -n worker/ami/bootstrap.sh
      - name: EC2 install script syntax
        run: bash -n worker/ami/ec2-install-from-s3.sh
      - name: Build worker bundle (artifact only, not uploaded)
        run: |
          chmod +x scripts/build-worker-bundle.sh
          TARGET_PY=3.9 scripts/build-worker-bundle.sh
      - name: Verify worker bundle offline import (Python 3.9)
        run: |
          chmod +x scripts/verify-worker-bundle.sh
          TARGET_PY=3.9 scripts/verify-worker-bundle.sh
      - name: Bootstrap docker verify (stub LightCraft)
        run: docker build -f worker/ami/Dockerfile.verify .
      - name: AL2023 user-data venv and vendored pip
        run: docker build -f worker/ami/Dockerfile.bootstrap-test .

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build & unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug test --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: photouploader-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
