name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lib tests
        run: |
          pip install pytest
          cd lib && pytest -q
      - name: Worker tests
        run: |
          pip install pytest
          cd worker && PYTHONPATH=. pytest -q
      - name: Backend moto tests
        run: |
          pip install -r backend/requirements-dev.txt
          PYTHONPATH=lib:backend/tests pytest -q backend/tests

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install & synth
        working-directory: infra
        run: |
          npm ci || npm install
          npm test
          npx cdk synth --quiet

  worker-ami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap script syntax
        run: bash -n worker/ami/bootstrap.sh
      - name: Bootstrap docker verify (stub LightCraft)
        run: docker build -f worker/ami/Dockerfile.verify .

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build & unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug test --stacktrace
